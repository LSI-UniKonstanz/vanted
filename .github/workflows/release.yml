# Publishes a GitHub Release for a tag v<version> on master. This is the only
# workflow that publishes anything. See RELEASING.md.
#
#   preflight     annotated tag, on master, matches build.number, not yet released
#   build         build.yml
#   sign-windows  vanted-install.exe via SignPath         } environment 'release':
#   sign-macos    app and DMG with Developer ID, notarized } approval first, then secrets
#   release       draft, upload assets, publish
#
# Both signing jobs wait for the same approval. Nothing is published until both
# have finished and all assets are uploaded.
#
# Without credentials the signing jobs pass the files through unsigned with a
# warning (macOS additionally runs an ad-hoc signing dry run). Setting
# WINDOWS_SIGNING_REQUIRED / MACOS_SIGNING_REQUIRED to true makes missing
# credentials fail the release. See packaging/SIGNING.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Checkout build.number and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src/main/resources/build.number
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Verify tag
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"

          # Fetch the tag as it is on GitHub; checkout may store it as a plain ref.
          git fetch --force --quiet origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "::error::$tag is not an annotated tag - create it with 'git tag -a $tag'"
            exit 1
          fi

          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/master; then
            echo "::error::$tag points to $commit, which is not on master"
            exit 1
          fi

          tag_version="${tag#v}"
          built_version=$(sed -n 's/^vanted\.version\.number=//p' src/main/resources/build.number | tr -d '\r')
          if [ "$tag_version" != "$built_version" ]; then
            echo "::error::$tag does not match vanted.version.number=$built_version"
            exit 1
          fi

          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            echo "::error::$tag is already published. Versions are never reused; release a fix as a new version."
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "$tag: annotated, on master ($commit), build.number $built_version"

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml

  sign-windows:
    needs: build
    runs-on: ubuntu-24.04
    environment: release

    permissions:
      contents: read
      actions: read   # SignPath reads job details and the artifact through GITHUB_TOKEN

    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-installers
          path: staging

      # Secrets cannot be tested in "if:" directly.
      - name: Check signing configuration
        id: cfg
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          set -eu
          if [ -n "$API_TOKEN" ] && [ -n "$ORG_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath is configured - signing the EXE"
          elif [ -n "$API_TOKEN$ORG_ID" ]; then
            echo "::error::SignPath is half configured: SIGNPATH_API_TOKEN (secret) and SIGNPATH_ORGANIZATION_ID (variable) are both required"
            exit 1
          elif [ "$REQUIRED" = "true" ]; then
            echo "::error::WINDOWS_SIGNING_REQUIRED is true but SignPath is not configured"
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows signing is not configured - vanted-install.exe is published UNSIGNED"
          fi

      # Signed under its final name, which the SignPath artifact configuration expects.
      - name: Prepare EXE
        run: |
          set -eu
          mkdir -p unsigned signed
          cp "staging/vanted-${{ needs.build.outputs.version }}-install.exe" unsigned/vanted-install.exe

      # SignPath downloads the file itself and verifies it comes from this run.
      - name: Upload unsigned EXE for SignPath
        id: unsigned
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-windows-unsigned
          path: unsigned/vanted-install.exe
          retention-days: 1
          overwrite: true

      # Each request is approved manually at SignPath, hence the long timeout.
      # SignPath accepts at most three re-runs of a workflow run.
      - name: Sign EXE with SignPath
        if: steps.cfg.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'vanted' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Pass through unsigned EXE
        if: steps.cfg.outputs.enabled != 'true'
        run: cp unsigned/vanted-install.exe signed/

      - name: Checkout checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: packaging/windows

      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'

      # Loads the embedded jar the way the launch4j header does, with Java 8.
      - name: Verify EXE
        env:
          SIGNED: ${{ steps.cfg.outputs.enabled }}
        run: |
          set -eu
          exe=signed/vanted-install.exe
          ls -l "$exe"
          mkdir -p "$RUNNER_TEMP/checks"
          javac -d "$RUNNER_TEMP/checks" src/packaging/windows/CheckExeJar.java
          java -cp "$RUNNER_TEMP/checks" CheckExeJar "$exe"
          if [ "$SIGNED" = "true" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode > /dev/null
            # The chain may not verify against the runner's CA store; only the
            # presence of a signature is checked.
            osslsigncode verify -in "$exe" > verify.txt 2>&1 || true
            cat verify.txt
            if grep -qi 'no signature found' verify.txt || ! grep -q 'Signer' verify.txt; then
              echo "::error::The EXE returned by SignPath has no Authenticode signature"
              exit 1
            fi
          fi

      - name: Upload final EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-windows
          path: signed/vanted-install.exe
          retention-days: 1
          overwrite: true

  sign-macos:
    needs: build
    runs-on: macos-15   # arm64, the smoke test runs the bundled JVM
    environment: release

    permissions:
      contents: read

    steps:
      - name: Checkout vanted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download unsigned DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-macos
          path: staging

      - name: Check signing configuration
        id: cfg
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
        run: |
          set -eu
          n=0
          for v in "$P12" "$P12_PASSWORD" "$NOTARY_KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"; do
            if [ -n "$v" ]; then n=$((n + 1)); fi
          done
          if [ "$n" -eq 5 ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Developer ID and notary key are configured - signing and notarizing"
          elif [ "$n" -gt 0 ]; then
            echo "::error::Apple signing is half configured ($n of 5 values). Required: MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_NOTARY_KEY (secrets), APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID (variables)"
            exit 1
          elif [ "$REQUIRED" = "true" ]; then
            echo "::error::MACOS_SIGNING_REQUIRED is true but Apple signing is not configured"
            exit 1
          else
            echo "mode=dryrun" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing is not configured - the DMG is published UNSIGNED; running an ad-hoc signing dry run"
          fi

      - name: Extract app from unsigned DMG
        run: |
          set -eu
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" \
                  "staging/vanted-${{ needs.build.outputs.version }}.dmg"
          ditto "$mnt/Vanted.app" "$RUNNER_TEMP/Vanted.app"
          hdiutil detach "$mnt" || { sleep 5; hdiutil detach -force "$mnt"; }
          echo "APP=$RUNNER_TEMP/Vanted.app" >> "$GITHUB_ENV"

      # Temporary keychain for this run; its password is random and not stored.
      - name: Import Developer ID certificate
        if: steps.cfg.outputs.mode == 'release'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          kc="$RUNNER_TEMP/vanted-signing.keychain-db"
          kc_pw=$(openssl rand -base64 32)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          echo "MACOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null

          # Intermediate certificate, in case the .p12 export lacks it.
          # Import fails harmlessly if it is already present.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
               https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" || true

          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          id=$(security find-identity -v -p codesigning "$kc" | awk '/"Developer ID Application: / {print $2; exit}')
          if [ -z "$id" ]; then
            echo "::error::The .p12 contains no 'Developer ID Application' certificate with private key"
            security find-identity -v -p codesigning "$kc"
            exit 1
          fi
          security find-identity -v -p codesigning "$kc" | grep "$id"
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Use ad-hoc identity (dry run)
        if: steps.cfg.outputs.mode == 'dryrun'
        run: echo "MACOS_SIGN_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Sign app bundle
        run: sh packaging/macos/sign-app.sh "$APP"

      # Starts the JVM under the hardened runtime and loads the re-signed
      # Adaptagrams library. A missing entitlement crashes here.
      - name: Smoke test signed runtime
        run: |
          set -eu
          rt="$APP/Contents/Java/runtime/Contents/Home"
          "$rt/bin/java" -version
          mkdir -p "$RUNNER_TEMP/checks"
          "$rt/bin/javac" -d "$RUNNER_TEMP/checks" packaging/macos/NativeLoadCheck.java
          "$rt/bin/java" -cp "$RUNNER_TEMP/checks" NativeLoadCheck \
              "$APP/Contents/Java/core-libs/adaptagrams.jar" native/mac-aarch64/libadaptagrams.dylib

          # The arm64 library already carries a linker signature and loads
          # without re-signing; only the hardened-runtime flag proves it was re-signed.
          lib="$RUNNER_TEMP/libadaptagrams.dylib"
          unzip -p "$APP/Contents/Java/core-libs/adaptagrams.jar" native/mac-aarch64/libadaptagrams.dylib > "$lib"
          codesign --display --verbose=2 "$lib" > "$RUNNER_TEMP/lib-signature.txt" 2>&1 || true
          cat "$RUNNER_TEMP/lib-signature.txt"
          if ! grep -Eq 'flags=.*runtime' "$RUNNER_TEMP/lib-signature.txt" \
             || grep -q 'linker-signed' "$RUNNER_TEMP/lib-signature.txt"; then
            echo "::error::libadaptagrams.dylib inside the jar was not re-signed"
            exit 1
          fi

      - name: Build, sign and notarize DMG
        if: steps.cfg.outputs.mode == 'release'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          mkdir -p final
          dmg=final/vanted-macos-arm64.dmg
          sh packaging/macos/createdmg.sh "$APP" "$dmg"
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"

          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          NOTARY_KEY_FILE="$RUNNER_TEMP/notary-key.p8" sh packaging/macos/notarize.sh "$dmg"

          # Assess DMG and app the way Gatekeeper does on the user's machine.
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg"
          spctl --assess --type execute --verbose=2 "$mnt/Vanted.app"
          hdiutil detach "$mnt" || { sleep 5; hdiutil detach -force "$mnt"; }

      - name: Pass through unsigned DMG
        if: steps.cfg.outputs.mode == 'dryrun'
        run: |
          mkdir -p final
          cp "staging/vanted-${{ needs.build.outputs.version }}.dmg" final/vanted-macos-arm64.dmg

      - name: Upload final DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-macos-final
          path: final/vanted-macos-arm64.dmg
          retention-days: 1
          overwrite: true

      - name: Remove keychain and notary key
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"

  release:
    needs: [preflight, build, sign-windows, sign-macos]
    runs-on: ubuntu-24.04

    # The only job with write access. It needs no secret.
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-installers
          path: staging

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-windows
          path: assets

      - name: Download Linux archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-linux
          path: staging

      - name: Download macOS disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}-macos-final
          path: assets

      # Asset names carry no version so that
      # https://github.com/<repo>/releases/latest/download/<name> stays valid.
      - name: Collect assets under stable names
        run: |
          set -eu
          v="${{ needs.build.outputs.version }}"
          cp "staging/vanted-$v-install.jar"          assets/vanted-install.jar
          cp "staging/vanted-$v-linux-x64.tar.gz"     assets/vanted-linux-x64.tar.gz
          cp "staging/vanted-$v-linux-arm64.tar.gz"   assets/vanted-linux-arm64.tar.gz
          test -f assets/vanted-install.exe
          test -f assets/vanted-macos-arm64.dmg
          (cd assets && sha256sum vanted-* > SHA256SUMS.txt)
          ls -lh assets/
          cat assets/SHA256SUMS.txt

      # Created as a draft and published only after every asset is uploaded, so
      # users never see a release with missing files. A draft left over from an
      # aborted run is replaced. An existing published release makes
      # "gh release create" fail; preflight reports that case earlier.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIBRARIES_REF: ${{ needs.build.outputs.libraries-ref }}
          BOOTSTRAP_REF: ${{ needs.build.outputs.bootstrap-ref }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"

          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
            echo "Replacing draft for $tag from an earlier run"
            gh release delete "$tag" --yes
          fi

          notes=$(printf '%s\n' \
            "Built by [workflow run](${RUN_URL})." \
            "Sources: vanted \`${COMMIT}\`, vanted-libraries \`${LIBRARIES_REF}\`, vanted-bootstrap \`${BOOTSTRAP_REF}\`." \
            "" \
            "Checksums: \`SHA256SUMS.txt\`." \
            "")

          gh release create "$tag" \
             --draft \
             --title "VANTED $VERSION" \
             --notes "$notes" \
             --generate-notes \
             assets/*

          expected=$(find assets -type f | wc -l)
          uploaded=$(gh release view "$tag" --json assets --jq '.assets | length')
          if [ "$uploaded" -ne "$expected" ]; then
            echo "::error::$uploaded of $expected assets uploaded - the draft stays unpublished; re-run the job"
            exit 1
          fi

          gh release edit "$tag" --draft=false
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
